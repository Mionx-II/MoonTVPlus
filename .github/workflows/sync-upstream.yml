name: Sync Upstream
on:
  schedule:
    - cron: '0 2 * * *' # UTC 每天凌晨 2 点，自行改成你想要频率
  workflow_dispatch: # 支持手动点 Run workflow 触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} --branch main
